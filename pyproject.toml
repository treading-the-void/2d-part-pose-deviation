[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "2d-part-pose-deviation"
version = "0.1.0"
description = "2D part pose deviation measurement with SuperPoint and a PyQt5 UI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "opencv-python>=4.8",
  "PyQt5>=5.15",
  "torch>=2.0",
  "scikit-learn>=1.3",
]

[project.optional-dependencies]
sam = ["segment-anything @ git+https://github.com/facebookresearch/segment-anything.git"]

[tool.setuptools.packages.find]
include = ["material_deviation*"]
